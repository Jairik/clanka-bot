# Training data for the "yo dipshit" openWakeWord detector.
# Same shape as clanker.yml: 10k synthetic clips, 50k steps, dnn layer 32.
# Paths are relative to the work directory run.sh creates.
#
# Same false-accept target as clanker (0.2 per hour). A looser 0.5 target
# shipped a model that still missed the owner's voice and woke on background
# about five times an hour. After real takes are a real share of training,
# the model that hears those takes sits at a detection threshold of 0.9:
# background false accepts drop to none in the measured hour, and the
# held-out real takes still score above 0.95.

model_name: "yo_dipshit"

target_phrase:
  - "yo dipshit"

# Near misses are synthesized from the phrase lists, so openWakeWord's own
# adversarial text generator is not asked for more.
custom_negative_phrases: []

# Training samples already exist under clips/; these counts only bound generation.
n_samples: 10000
n_samples_val: 2000
tts_batch_size: 1
augmentation_batch_size: 16

# Unused: clips are synthesized with Pocket TTS, not Piper.
piper_sample_generator_path: "./stub_piper"

output_dir: "./clips"

rir_paths:
  - "./data/mit_rirs/16khz"

background_paths:
  - "./background"

background_paths_duplication_rate:
  - 1

false_positive_validation_data_path: "./data/validation_set_features.npy"

# One augmented realization per clip. The pinned openWakeWord revision stops
# at one feature row per clip, so a higher round count does not add rows.
augmentation_rounds: 1

# A 200k-row slice of ACAV100M, same as the clanker run.
feature_data_files:
  "ACAV100M_sample": "./data/acav_subset.npy"

batch_n_per_class:
  "ACAV100M_sample": 1024
  "adversarial_negative": 50
  "positive": 50

model_type: "dnn"
layer_size: 32

steps: 50000
max_negative_weight: 1500
target_false_positives_per_hour: 0.2
