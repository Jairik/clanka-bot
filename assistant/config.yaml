# Non-secret assistant settings. Secrets belong in .env, never here.

http:
  # Health endpoint. Docker publishes this on the host loopback only.
  addr: ":8080"

debug:
  # Localhost-only typed-transcript and Announcement entries used to exercise
  # the pipeline.
  enabled: true
  # Loopback by default. Compose overrides this to ":8081" because the
  # published port is already bound to 127.0.0.1 on the host.
  addr: "127.0.0.1:8081"

dashboard:
  # Tailscale login allowed to use the Dashboard. Empty disables the listener,
  # so a fresh checkout exposes no web UI. Set this to the login reported by
  # `tailscale status --json`, then expose the loopback port with
  # `tailscale serve` and an owner-only ACL (docs/deploy.md).
  owner: ""
  # Loopback listener. Compose overrides this to ":8082" because a
  # container-bound 127.0.0.1 is unreachable through Docker's published port;
  # the host mapping is still 127.0.0.1 only.
  addr: "127.0.0.1:8082"
  # One Health page refresh, covering every service and module check. Checks
  # that overrun are shown as timed out; no request waits longer than this.
  health_timeout: 3s

data:
  # The one SQLite database (ADR-0003): settings overrides today, secrets and
  # alerts later. Compose mounts the assistant-data volume at /app/data and
  # sets ASSISTANT_DATA_DIR; local runs default to ./data.
  dir: "data"

tools:
  # Applied to Tools that do not declare their own timeout.
  default_timeout: 2s
  # Config layer for Tool overrides. A stored override wins over these, and
  # these win over the code defaults; DELETE /api/tools/<name> returns here.
  # Permissions may only tighten the code-declared level; unknown names fail
  # startup.
  disabled: []
  permissions: {}
  # Each Tool module reads its own tools.<name> block; an omitted key or block
  # uses the code defaults shown here.
  weather:
    geocoding_url: "https://geocoding-api.open-meteo.com/v1/search"
    forecast_url: "https://api.open-meteo.com/v1/forecast"
    # Per upstream call.
    timeout: 1500ms
    # Geocode plus forecast together.
    budget: 2s
  audio:
    # One "louder" or "quieter" step in percent.
    step_percent: 10
  timer:
    alert_text: "Your timer is done."

# Embed service (MiniLM). Model name is here so bge-small can be tried later.
embed:
  url: "http://embed:8085"
  model: "sentence-transformers/all-MiniLM-L6-v2"
  # Per-request budget; over it, semantic matching is skipped.
  timeout: 150ms

# Semantic Fast path tuning from the #26 routing evaluation. The corpus is
# internal/pipeline/testdata/routing_eval.yaml (160 positives, 20 per Tool, 48
# negatives and 8 compounds) run against sentence-transformers/all-MiniLM-L6-v2.
# At these values every Tool had precision 1.00 against the confirmed 0.95
# per-Tool floor, overall recall was 0.59, and no negative or compound reached
# the Fast path. Recall is deliberately low: ambiguous phrasing goes to the
# Agent path instead of risking a wrong Tool call. See docs/routing-eval.md.
semantic:
  threshold: 0.71
  margin: 0.23
  # Compound requests with one of these joiners go to the Agent path.
  joiners: ["and", "then", "also"]

tts:
  # Wyoming TTS service. Compose sets this to the tts container; an empty
  # address disables spoken replies and leaves the debug entry text-only.
  addr: "tts:10200"
  # Pocket TTS voice name, a local wav, or an hf:// voice URL.
  voice: "alba"
  # Covers connect plus the gap between audio chunks.
  timeout: 30s

# Microphone capture. Only this process opens the Pulse source (ADR-0001).
capture:
  # Named Pulse source from `pactl list short sources`. Empty uses the default.
  source: ""
  # parec resamples the source to this format before the services see it.
  binary: "parec"
  rate: 16000
  width: 2
  channels: 1
  # PCM frame handed to the wake word and STT services (32 ms at 16 kHz).
  frame_ms: 32

wakeword:
  # Wyoming openWakeWord service. An empty address disables voice input and
  # leaves the typed debug entry working.
  addr: "wakeword:10400"
  # openWakeWord model name, e.g. okay_nabu, hey_jarvis, hey_rhasspy.
  # Empty accepts any model the service has loaded.
  model: "okay_nabu"
  timeout: 10s
  chime:
    # Two-tone chime on wake detection. Not played when a request is accepted.
    enabled: true

stt:
  # Our Wyoming wrapper around Moonshine Voice.
  addr: "stt:10300"
  # small-streaming is the default; tiny-streaming is the low-CPU fallback.
  # Both are baked into the image at build time.
  model: "small-streaming"
  language: "en"
  # Covers connect, finalisation and the response.
  timeout: 20s
  endpoint:
    # Fixed end-of-speech window from the latency budget (#12), not adaptive.
    silence: 500ms
    # RMS level below which a frame counts as silence. This is not a claim
    # about every mic: the dev box's Webcam C270 measured -37.9 to -29.7 dBFS
    # idle at 100% source volume, above this default. Measure with
    # scripts/mic-noise-check.sh and set the gain before a human-mic run (#36).
    threshold_dbfs: -38
    # Above-threshold audio needed before it counts as the question, so a chime
    # tail or click cannot open an utterance and then end it on silence.
    min_speech: 200ms
    # Safety cap so a false wake cannot listen forever.
    max_utterance: 15s

playback:
  # pacat from pulseaudio-utils. Only this container mounts the Pulse socket.
  binary: "pacat"
  # Named Pulse sink, e.g. the Echo Dot once Bluetooth A2DP is set up.
  # Empty uses the host's default sink.
  sink: ""

# Public-IP geolocation. Only city, region and timezone are kept; the fields
# parameter stops the service sending coordinates at all.
location:
  provider_url: "https://ipwho.is/?fields=success,city,region,timezone"
  # Look up once at startup, then this often. Failures keep the last value.
  refresh_interval: 24h
  timeout: 5s
  # Used when a lookup has never succeeded. Leave empty for no location.
  fallback:
    city: ""
    region: ""
    timezone: ""

# Exact-match Control phrases, entered just after STT.
control_phrases:
  "what time is it": time.now
  "what's the time": time.now
  "what is the time": time.now
  "tell me the time": time.now
  "time": time.now
  # Playback and timer controls are single words, which embed poorly, so they
  # are matched exactly instead. "louder" calls volume_set with no arguments,
  # which means one step up.
  "stop": audio.stop
  "pause": audio.stop
  "cancel": timer.cancel
  "louder": audio.volume_set
  "what's the weather like": weather.current
  "what is the weather like": weather.current
  "what's the weather": weather.current
  "how's the weather": weather.current

# The Agent path: one OpenAI-compatible provider, no failover.
agent:
  provider: openrouter
  providers:
    openrouter:
      base_url: https://openrouter.ai/api/v1
      # The key lives only in the environment, never in this file.
      api_key_env: OPENROUTER_API_KEY
      model: deepseek/deepseek-v4.1-flash
      # Written second choice for a manual switch only. There is no runtime
      # failover (ADR-0002), so this value is not read by the client.
      alternate_model: deepseek/deepseek-v4-pro
      routing:
        # OpenRouter prefers low-latency hosts. ZDR and data-collection denial
        # are forced in code (ADR-0002), not configurable here.
        sort: latency
  # Spoken cue played the moment a request goes to the Agent path. It is
  # synthesized once at startup and cached, so it is heard instantly. Empty is a
  # startup error; a config change needs a restart, which rebuilds the cache.
  filler: "One moment."
  unavailable_message: "Sorry, I can't answer that right now."
  # Typed prefixes that skip the Fast path entirely.
  request_prefixes:
    - ask the agent
    - agent
    - hey agent
  history:
    turns: 10
    quiet: 5m
  first_token_timeout: 8s
  request_timeout: 60s
  max_steps: 6
