# Training data for the "clanker" openWakeWord detector.
# Paths are relative to the work directory run.sh creates.

model_name: "clanker"

target_phrase:
  - "clanker"

# Near misses are synthesized from training/negative_phrases.txt and
# training/near_misses.txt by run.sh clips/acceptance, so openWakeWord's own
# adversarial text generator is not asked for more.
custom_negative_phrases: []

# Training samples already exist under clips/; these counts only bound generation.
n_samples: 10000
n_samples_val: 2000
tts_batch_size: 1
augmentation_batch_size: 16

# Unused: clips are synthesized with Pocket TTS, not Piper.
piper_sample_generator_path: "./stub_piper"

output_dir: "./clips"

rir_paths:
  - "./data/mit_rirs/16khz"

background_paths:
  - "./background"

background_paths_duplication_rate:
  - 1

false_positive_validation_data_path: "./data/validation_set_features.npy"

# One augmented realization per clip with a background mix and an RIR. Raising
# this does nothing at the pinned openWakeWord revision: its feature writer
# stops at one row per clip (n_total), so 2 bought the same 10k rows as 1.
augmentation_rounds: 1

# The full ACAV100M feature file is 17 GB and cannot stay in the page cache on
# the 31 GB dev box, so training reads a 200k-row slice sampled evenly across
# the file (training/acav_subset.py). 50k steps still see every row many times.
feature_data_files:
  "ACAV100M_sample": "./data/acav_subset.npy"

batch_n_per_class:
  "ACAV100M_sample": 1024
  "adversarial_negative": 50
  "positive": 50

model_type: "dnn"
layer_size: 32

# The upstream default. A step is a few milliseconds; the run is dominated by
# the 60 validation passes auto_train schedules regardless of this value.
steps: 50000
max_negative_weight: 1500
target_false_positives_per_hour: 0.2
