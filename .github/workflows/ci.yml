name: CI

on:
  push:
  pull_request:

# One run per ref; a newer push cancels the older, superseded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only: the workflow only checks out code and runs Go tests.
permissions:
  contents: read

jobs:
  go-test:
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: assistant/go.mod
          cache-dependency-path: assistant/go.sum
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race -count=1 ./...

  web:
    name: Dashboard web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assistant/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # The action reads the packageManager field from this file. It
          # resolves the path from the repository root, not from the step's
          # working-directory, so it has to name the app's own package.json.
          package_json_file: assistant/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: assistant/web/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version-file: assistant/go.mod
          cache-dependency-path: assistant/go.sum
      - run: pnpm install --frozen-lockfile
      # The view types are generated from the Go structs; a stale file means the
      # contract has drifted and a page would render undefined.
      - run: go run ./cmd/gentypes
        working-directory: assistant
      - run: git diff --exit-code -- web/src/types.ts
        working-directory: assistant
      # Typecheck and production build (the same bundle the image embeds).
      - run: pnpm build

  web-test:
    # Keep logic regressions visible separately from bundling failures.
    name: Dashboard frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assistant/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: assistant/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: assistant/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  web-smoke:
    # A browser drives the production bundle through the Go handler, so a route
    # that stops loading, a console error or a dead API fails the PR.
    name: Dashboard browser smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assistant/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: assistant/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: assistant/web/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version-file: assistant/go.mod
          cache-dependency-path: assistant/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # The build lands in the Go embed directory, so the stub serves exactly
      # the bundle the image would.
      - run: pnpm build
      - run: pnpm test:smoke

  tts-test:
    name: TTS Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install wire-format test dependencies
        run: pip install "wyoming==1.11.0" numpy pytest
      - name: Test
        run: python -m pytest tts/tests -q
      - name: STT test
        run: python -m pytest stt/tests -q

  scripts-test:
    # The deploy/auto-deploy path and the Wyoming Python suites are what puts
    # code on the living-room Pi; a change there must not merge green and only
    # fail on hardware. Covers the black-box shell suites, the scripts and
    # wakeword CLIs, and the STT server (which `make tts-test` omits locally).
    name: Scripts and Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install wire-format and test dependencies
        run: pip install "wyoming==1.11.0" numpy pytest
      - name: scripts/tests Python suites
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: scripts/prototype-run/tests Python suites
        run: python -m unittest discover -s scripts/prototype-run/tests -p 'test_*.py' -v
      - name: wakeword/tests Python suites
        run: python -m unittest discover -s wakeword/tests -p 'test_*.py' -v
      - name: TTS and STT server tests
        run: python -m pytest tts/tests stt/tests -q
      - name: deploy.sh black-box tests
        run: bash scripts/tests/deploy_test.sh
      - name: deploy-watch.sh black-box tests
        run: bash scripts/tests/deploy_watch_test.sh
      - name: check-compose.sh black-box tests
        run: bash scripts/tests/check_compose_test.sh

  compose:
    # Validates the compose file itself and the deployment conventions the
    # stack relies on (image tags, least privilege, local-only health checks).
    # The .env is copied so variable interpolation matches a real deploy.
    name: Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare .env for interpolation
        run: cp .env.example .env
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Check compose conventions
        run: bash scripts/check-compose.sh

  routing-eval:
    name: Routing eval (real MiniLM)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: assistant/go.mod
          cache-dependency-path: assistant/go.sum
      - uses: docker/setup-buildx-action@v3
      - name: Build the pinned MiniLM image
        uses: docker/build-push-action@v6
        with:
          context: ./embed
          load: true
          tags: clanka/embed:ci
          # The model bake is the slow layer; keep it across workflow runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the real embed service
        run: |
          docker run -d --name clanka-embed-ci -p 127.0.0.1:18085:8085 clanka/embed:ci
          # The app loads MiniLM at startup; wait for its real readiness probe.
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:18085/healthz; then
              exit 0
            fi
            sleep 2
          done
          echo "embed service did not become healthy" >&2
          docker logs clanka-embed-ci >&2
          exit 1
      # Only the routing/conformance packages read ROUTING_EVAL_EMBED_URL: the
      # Example suites under tools/... and the routing eval in internal/pipeline.
      # A non-conformance package that starts using the variable later would not
      # be covered here; the full suite with the race detector runs in go-test.
      - name: Test conformance & routing packages with real MiniLM
        working-directory: assistant
        env:
          ROUTING_EVAL_EMBED_URL: http://127.0.0.1:18085
        run: go test -count=1 ./tools/... ./internal/pipeline
      - name: Routing eval baseline gate
        working-directory: assistant
        env:
          ROUTING_EVAL_EMBED_URL: http://127.0.0.1:18085
        run: go test ./internal/pipeline -run TestRoutingEvalAgainstMiniLM -count=1 -v
      - name: Stop the embed service
        if: always()
        run: docker rm -f clanka-embed-ci || true
