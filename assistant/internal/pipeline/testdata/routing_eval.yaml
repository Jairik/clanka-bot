# Compound requests ask for more than one thing. They are kept separate so
# the evaluation can report compound handling on its own.
compounds:
  - what time is it and set a timer for five minutes
  - set a timer for five minutes and tell me the weather
  - turn the volume down and stop the music
  - what's the date and what time is it
  - cancel the timer and set a new one for ten minutes
  - tell me the time then play some music
  - set a timer for 5 minutes and remind me to check the oven
  - stop talking and tell me the time
