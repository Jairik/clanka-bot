# Labelled routing corpus for the Fast path.
#
# This file is an oracle, not training data: labels come from what a user
# means, never from what the current model happens to predict. Do not remove a
# hard negative or a natural paraphrase just to make the numbers look better.
#
# positives: one list per Fast path Tool. Each utterance must reach that Tool
# (through an exact Control phrase or semantic matching) and survive
# extraction, otherwise it counts as a miss.
#
# negatives: utterances that must not reach the Fast path. They include plain
# Agent requests, questions that sound like a Tool but are not one, and
# compound requests that ask for more than one thing.
