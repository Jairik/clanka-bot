# Training data for the wake-free "stop" command model (#503).
# Run with: wakeword/train all --phrase stop --from <dashboard bundle>
# Paths are relative to the work directory run.sh creates.
#
# The model only acts while a reply is playing: a detection cancels the reply,
# drops a pending Confirmation and ends the session. It therefore has to hear a
# bare "stop" over the bot's own voice and must not fire on the bot saying
# "stopped", "top", "the next stop" and so on.
#
# Only the bare word is positive. The negatives are one-phoneme neighbours
# (top, shop, step, stock, spot), compounds (stopwatch, non-stop, bus stop) and
# ordinary sentences where "stop" is not a command ("it stopped raining",
# "don't stop"). Phrases that are a stop request ("stop the music", "stop it",
# "stop talking") are deliberately in neither set: firing on them cancels the
# reply, which is what the speaker wanted anyway.
#
# Music background: drop 16 kHz mono WAVs with vocals into
# $WORK/background before `train` for a music-heavy run (keep them out of git).

model_name: "stop"

target_phrase:
  - "stop"

custom_negative_phrases: []

n_samples: 6000
n_samples_val: 1200
tts_batch_size: 1
augmentation_batch_size: 16

piper_sample_generator_path: "./stub_piper"

output_dir: "./clips"

rir_paths:
  - "./data/mit_rirs/16khz"

background_paths:
  - "./background"

background_paths_duplication_rate:
  - 1

false_positive_validation_data_path: "./data/validation_set_features.npy"

augmentation_rounds: 1

feature_data_files:
  "ACAV100M_sample": "./data/acav_subset.npy"

batch_n_per_class:
  "ACAV100M_sample": 1024
  "adversarial_negative": 50
  "positive": 50

model_type: "dnn"
layer_size: 32

# One syllable carries less evidence than "volume up", so the starter keeps the
# command recipe and leans on the owner's takes (--real-weight) for recall.
steps: 30000
max_negative_weight: 1500
# A false stop cuts off a reply mid-sentence; ask for the command target.
target_false_positives_per_hour: 0.1
