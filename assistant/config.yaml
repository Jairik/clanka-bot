# Non-secret assistant settings. Secrets belong in .env or the write-only
# secrets store, never here.

http:
  # Health endpoint. Docker publishes this on the host loopback only.
  addr: ":8080"

debug:
  # Localhost-only typed-transcript and Announcement entries used to exercise
  # the pipeline.
  enabled: true
  # Loopback by default. Compose overrides this to ":8081" because the
  # published port is already bound to 127.0.0.1 on the host.
  addr: "127.0.0.1:8081"

dashboard:
  # Tailscale login allowed to use the Dashboard. Empty disables the listener,
  # so a fresh checkout exposes no web UI. Set this to the login reported by
  # `tailscale status --json`, then expose the loopback port with
  # `tailscale serve` and an owner-only ACL (docs/deploy.md).
  owner: ""
  # Loopback listener. Compose overrides this to ":8082" because a
  # container-bound 127.0.0.1 is unreachable through Docker's published port;
  # the host mapping is still 127.0.0.1 only.
  addr: "127.0.0.1:8082"
  # One Health page refresh, covering every service and module check. Checks
  # that overrun are shown as timed out; no request waits longer than this.
  health_timeout: 3s

data:
  # The one SQLite database (ADR-0003): settings overrides, write-only secrets
  # and alerts. Compose mounts the assistant-data volume at /app/data and sets
  # ASSISTANT_DATA_DIR; local runs default to ./data. The file is mode 0600 and
  # unencrypted, so treat a backup like the secrets it contains.
  dir: "data"

# The IANA timezone clock-time Alarms and Reminders are interpreted in. This is
# the config layer of the live `timezone` setting; a Dashboard or voice override
# wins. Empty uses the TZ environment variable, then UTC, and UTC logs a startup
# warning. The location service's IP lookup never supplies this value.
timezone: ""

tools:
  # Applied to Tools that do not declare their own timeout.
  default_timeout: 2s
  # Config layer for Tool overrides. A stored override wins over these, and
  # these win over the code defaults; DELETE /api/tools/<name> returns here.
  # Permissions may only tighten the code-declared level; unknown names fail
  # startup.
  disabled: []
  permissions: {}
  # Each Tool module reads its own tools.<name> block; an omitted key or block
  # uses the code defaults shown here.
  weather:
    geocoding_url: "https://geocoding-api.open-meteo.com/v1/search"
    forecast_url: "https://api.open-meteo.com/v1/forecast"
    # Per upstream call.
    timeout: 1500ms
    # Geocode plus forecast together.
    budget: 2s
  audio:
    # One "louder" or "quieter" step in percent.
    step_percent: 10
  notify:
    # Title shown on the phone Notification. The topic and token are secrets.
    title: "Assistant"
  web:
    # Agent-path web search. The backend is a config switch over the Provider
    # interface; only "searxng" exists, and an unknown value fails startup.
    # The Compose service is internal-only (never published) and answers JSON.
    backend: "searxng"
    base_url: "http://web-search:8080"
    # One search request, including reading the response body. This sits above
    # SearXNG's own 1.5 s per-engine budget so the container can answer with the
    # engines that did respond instead of the client cutting the page off.
    timeout: 2500ms
    # Default result count when the model omits max_results, and the cap a
    # model-supplied value is clamped to. Each result is title, URL and snippet.
    results: 5
    max_results: 10
    # Agent-path page reading. One public http(s) page is fetched behind an
    # SSRF guard (public addresses only, DNS pinned, every redirect checked),
    # then the main article text is extracted and truncated. Omitted fields
    # use the code defaults; an explicit zero is rejected.
    fetch:
      # One page request, including the decompressed body.
      timeout: 8s
      # HTML bound after transparent decompression.
      max_bytes: 2097152
      # Readable-text rune limit handed to the model; the Tool marks the cut.
      max_chars: 4000
      # Redirect chain bound; every hop is revalidated.
      max_redirects: 5
  github:
    # Agent-path GitHub Tools. The token is a write-only secret, never here.
    # issue_create and pr_list work with a fine-grained PAT; notifications are
    # the exception because GitHub's notifications API only accepts a classic
    # token (see README.md "GitHub").
    base_url: "https://api.github.com"
    # One HTTP request, including reading the response body.
    timeout: 4s
    # The operator target when the model omits repo. No repository is
    # hardcoded in the generic Tool logic; this is the only place the default
    # lives. An empty value means the model must supply a repo every time.
    default_repo: "Jairik/clanka-bot"
    # issue_create refuses any repository not listed here before any HTTP
    # write. An empty list refuses every issue write.
    allowed_repos: ["Jairik/clanka-bot"]
    # Default and maximum item counts for pr_list and notifications. The
    # maximum is also a prompt-size bound.
    results: 10
    max_results: 20
  timer:
    alert_text: "Your timer is done."
  voice:
    # One "faster"/"slower" step as a multiplier fraction. voice.rate is clamped
    # to [0.5, 2.0] and rounded to two decimals.
    step: 0.1

# Embed service (MiniLM). Model name is here so bge-small can be tried later.
embed:
  url: "http://embed:8085"
  model: "sentence-transformers/all-MiniLM-L6-v2"
  # Per-request budget; over it, semantic matching is skipped.
  timeout: 150ms

# Semantic Fast path tuning from the #26 routing evaluation. The corpus is
# internal/pipeline/testdata/routing_eval.yaml (804 positives, at least 20 per
# Tool, 177 negatives and 31 compounds) run against
# sentence-transformers/all-MiniLM-L6-v2. At these values every Tool has
# precision 1.00 against the confirmed 0.95 per-Tool floor, overall recall is
# 0.6953, and no negative or compound reaches the Fast path. Recall is
# deliberately conservative: ambiguous phrasing goes to the Agent path instead
# of risking a wrong Tool call. See docs/routing-eval.md.
semantic:
  threshold: 0.71
  margin: 0.23
  # Compound requests with one of these joiners go to the Agent path.
  joiners: ["and", "then", "also"]

# The shared spoken-name matcher for sounds, voices and Spotify playlists.
# This value is the config layer of the live `name_match.threshold` setting; a
# Dashboard or voice override wins. Exact and normalised names always resolve
# first; only a near miss needs the embed service. Raise it to be stricter,
# lower it to accept looser wording. See README.md "Name matching".
name_match:
  threshold: 0.60

tts:
  # Wyoming TTS service. Compose sets this to the tts container; an empty
  # address disables spoken replies and leaves the debug entry text-only.
  addr: "tts:10200"
  # Pocket TTS voice name. This is the config layer of the live `voice.name`
  # setting; a Dashboard or voice override wins. Built-in names are the voices
  # the tts image warmed (TTS_VOICES), not an invented catalogue.
  voice: "alba"
  # Covers connect plus the gap between audio chunks.
  timeout: 30s

# Custom voice states: pre-exported Pocket TTS .safetensors files in one folder
# on the voices volume. Only that folder is mounted read-only into tts and is
# never baked into an image or committed. Only .safetensors is accepted (no
# .pt/.pth/pickle), at most 32 MB. The Dashboard's /voices page stages and
# uploads one file, or a manual copy is picked up by the next restart; either
# way a file is usable only after the library smoke-tests it against the
# running model revision. A stale entry is flagged for re-export on the desktop.
voice:
  # Empty means data.dir/voices. A relative path resolves under data.dir; an
  # absolute path names a volume path, so files can be copied in headlessly.
  dir: "voices"
  # The same folder inside the tts container. Compose mounts only the voices
  # volume at /voices read-only; the assistant sends "<tts_dir>/<file>" to tts
  # and never a host path.
  tts_dir: "/voices"
  # Config layer of the live `voice.rate` setting: 1.0 is normal, 1.2 is 20%
  # faster. Implemented by resampling, so pitch rises with speed; values are
  # clamped to [0.5, 2.0].
  rate: 1.0

# Microphone capture. Only this process opens the Pulse source (ADR-0001).
capture:
  # Named Pulse source from `pactl list short sources`. Empty uses the default.
  source: ""
  # parec resamples the source to this format before the services see it.
  binary: "parec"
  rate: 16000
  width: 2
  channels: 1
  # PCM frame handed to the wake word and STT services (32 ms at 16 kHz).
  frame_ms: 32

wakeword:
  # Wyoming openWakeWord service. An empty address disables voice input and
  # leaves the typed debug entry working.
  addr: "wakeword:10400"
  # openWakeWord model name, e.g. okay_nabu, hey_jarvis, hey_rhasspy.
  # Empty accepts any model the service has loaded.
  model: "okay_nabu"
  timeout: 10s
  chime:
    # Master switch for the wake Cue. The sound itself is sounds.wake (default:
    # the two-tone chime); false silences wake even when a role is assigned.
    # Not played when a request is accepted.
    enabled: true

stt:
  # Our Wyoming wrapper around Moonshine Voice.
  addr: "stt:10300"
  # small-streaming is the default; tiny-streaming is the low-CPU fallback.
  # Both are baked into the image at build time.
  model: "small-streaming"
  language: "en"
  # Covers connect, finalisation and the response.
  timeout: 20s
  endpoint:
    # Fixed end-of-speech window from the latency budget (#12), not adaptive.
    silence: 500ms
    # RMS level below which a frame counts as silence. This is not a claim
    # about every mic: the dev box's Webcam C270 measured -37.9 to -29.7 dBFS
    # idle at 100% source volume, above this default. Measure with
    # scripts/mic-noise-check.sh and set the gain before a human-mic run (#36).
    threshold_dbfs: -38
    # Above-threshold audio needed before it counts as the question, so a chime
    # tail or click cannot open an utterance and then end it on silence.
    min_speech: 200ms
    # Safety cap so a false wake cannot listen forever.
    max_utterance: 15s

playback:
  # pacat from pulseaudio-utils. Only this container mounts the Pulse socket.
  binary: "pacat"
  # Named Pulse sink, e.g. the Echo Dot once Bluetooth A2DP is set up.
  # Empty uses the host's default sink.
  sink: ""

# Fixed Cue roles (GLOSSARY: Cue). Each value names a built-in sound ("chime"),
# a WAV file in data/sounds (for example "birds"), a path under the data volume
# (for example "sounds/birds.wav"), or "none" to stay silent. A Dashboard or
# voice write stores the same live setting and wins over this layer. Length
# caps are checked on assignment and a longer sound is rejected, never trimmed:
# wake 1.0 s, reminder/error 3 s, timer_ring/alarm_ring 60 s.
# Cue role assignments. A value is a built-in name, a library sound uploaded
# from the Dashboard, a WAV path under the data volume, or none. The Dashboard
# Sounds page also uploads canonical WAVs into data/sounds/.
sounds:
  wake: chime
  timer_ring: chime
  alarm_ring: chime
  reminder: chime
  error: chime

# Public-IP geolocation. Only city, region and timezone are kept; the fields
# parameter stops the service sending coordinates at all.
location:
  provider_url: "https://ipwho.is/?fields=success,city,region,timezone"
  # Look up once at startup, then this often. Failures keep the last value.
  refresh_interval: 24h
  timeout: 5s
  # Used when a lookup has never succeeded. Leave empty for no location.
  fallback:
    city: ""
    region: ""
    timezone: ""

# Quiet hours: one daily window plus a timed do-not-disturb and the "I'm awake"
# bypass. The Dashboard Settings page and the quiet.set/off/dnd/awake voice Tools
# write the same stored overrides; a stored value wins over this layer. The
# window is evaluated in the effective timezone, and an end earlier than the
# start crosses midnight. Inside it, Announcements are held and released as one
# summary, Notifications are muted, and replies, Fillers, Timers and Reminders
# use quiet.volume. Alarms are exempt and Ring normally. Volume is applied in
# software to the PCM, so the host media volume is never changed.
quiet:
  enabled: false
  start: "22:30"
  end: "07:00"
  # Absolute percent, independent of the media volume.
  volume: 35

# ntfy Notifications. The URL is a live setting defaulting to the public
# ntfy.sh; a stored Dashboard override wins. The topic is generated once on
# first use and stored in the write-only secrets table, never here. An optional
# server-issued access token lives in NTFY_TOKEN. On ntfy.sh the random topic
# is an unguessable name, not access control: anyone who learns it can
# subscribe. Missed Timer/Alarm Notifications are muted (dropped, not delayed)
# during Quiet hours.
notify:
  url: "https://ntfy.sh"
  missed_alerts: true

# Exact-match Control phrases, entered just after STT. These are the config.yaml
# layer of the live wording settings; a stored override applies on the next
# request. A value names one Tool ("audio.stop") or one shared Focus intent from
# the fixed list: stop, pause, resume, next, cancel, snooze. An intent goes to
# whatever holds Focus, in the fixed order ringing Scheduled alert > current
# reply > playing music; with nothing in Focus the utterance falls through to
# the semantic Fast path.
control_phrases:
  "what time is it": time.now
  "what's the time": time.now
  "what is the time": time.now
  "tell me the time": time.now
  "time": time.now
  # Playback and timer controls are single words, which embed poorly, so they
  # are matched exactly instead. "louder", "quieter" and "mute" still run
  # volume_set's Extract, so the direction and the zero level come from the
  # phrase. "stop", "pause", "cancel" and "snooze" are shared intents: they
  # reach a ringing alert, the current reply or music before any Tool. Snooze
  # on a Timer acts as stop; #53 gives an Alarm its real snooze.
  "stop": stop
  "pause": pause
  "cancel": cancel
  "snooze": snooze
  "louder": audio.volume_set
  "quieter": audio.volume_set
  "mute": audio.volume_set
  # The voice library questions are short and semantically close to each
  # other, so these fixed phrasings route exactly instead of relying on the
  # margin. The paraphrases still exercise the semantic Fast path.
  "what voices do you have": voice.list
  "list the voices": voice.list
  "what voices are available": voice.list
  "list your voices": voice.list
  "which voice is this": voice.current
  "what voice are you using": voice.current
  "what's your current voice": voice.current
  # Persona questions are close to each other and to the voice questions, so
  # the short ones are exact. Selecting a named persona still uses the semantic
  # Fast path and extracts the spoken name.
  "what personas do you have": persona.list
  "list the personas": persona.list
  "what personas are available": persona.list
  "which persona are you using": persona.current
  "what persona is active": persona.current
  "what persona is selected right now": persona.current
  "are you in character": persona.current
  # A bare Control phrase means one step faster; "slower" and "normal speed"
  # go through the semantic Fast path so their direction is extracted.
  "speak faster": voice.rate
  "talk faster": voice.rate
  "what's the weather like": weather.current
  "what is the weather like": weather.current
  "what's the weather": weather.current
  "how's the weather": weather.current
  # Quiet hours short answers are exact phrases so a single ambiguous word is
  # not left to embedding. The longer window and duration requests use the
  # quiet.* Tools' Examples on the semantic Fast path.
  "turn off quiet hours": quiet.off
  "quiet hours off": quiet.off
  "i'm awake": quiet.awake
  "i am awake": quiet.awake

# The Agent path: one OpenAI-compatible provider, no failover.
agent:
  provider: openrouter
  providers:
    openrouter:
      base_url: https://openrouter.ai/api/v1
      # The key resolves from the write-only secrets table first, then this
      # environment variable. Set it on the Dashboard Secrets page, through
      # /api/secrets, or in .env; never here.
      api_key_env: OPENROUTER_API_KEY
      # Config layer of the live `agent.model` setting. A Dashboard override
      # wins and is read before the next provider request.
      model: deepseek/deepseek-v4.1-flash
      # Written second choice for a manual switch only. There is no runtime
      # failover (ADR-0002), so this value is not read by the client.
      alternate_model: deepseek/deepseek-v4-pro
      routing:
        # OpenRouter prefers low-latency hosts. ZDR and data-collection denial
        # are forced in code (ADR-0002), not configurable here.
        sort: latency
  # Spoken cue played the moment a request goes to the Agent path. It is
  # synthesized once at startup and cached, so it is heard instantly. This is
  # the config layer of the live `agent.filler` setting: an override re-synthesizes
  # the cached audio in the background and keeps serving the old clip until ready.
  filler: "One moment."
  # Config layer of the live `agent.unavailable_message` setting.
  unavailable_message: "Sorry, I can't answer that right now."
  # Typed prefixes that skip the Fast path entirely. Config layer of the live
  # `agent.request_prefixes` setting; a stored override applies next request.
  request_prefixes:
    - ask the agent
    - agent
    - hey agent
  history:
    turns: 10
    quiet: 5m
  first_token_timeout: 8s
  request_timeout: 60s
  max_steps: 6
