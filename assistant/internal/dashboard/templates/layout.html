{{define "page_head"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assistant · Dashboard</title>
  <link rel="stylesheet" href="/static/app.css">
  <!-- htmx is vendored: no build step, and no internet access at runtime. -->
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="top">
    <div class="brand">assistant<span>·</span>dashboard</div>
    <nav aria-label="Dashboard">
      <a href="/activity" {{if eq .Page "activity"}}aria-current="page"{{end}}>Activity</a>
      <a href="/health" {{if eq .Page "health"}}aria-current="page"{{end}}>Health</a>
      <a href="/alerts" {{if eq .Page "alerts"}}aria-current="page"{{end}}>Alerts</a>
      <a href="/sounds" {{if eq .Page "sounds"}}aria-current="page"{{end}}>Sounds</a>
      <a href="/voices" {{if eq .Page "voices"}}aria-current="page"{{end}}>Voices</a>
      <a href="/personas" {{if eq .Page "personas"}}aria-current="page"{{end}}>Personas</a>
      <a href="/secrets" {{if eq .Page "secrets"}}aria-current="page"{{end}}>Secrets</a>
      <a href="/settings" {{if eq .Page "settings"}}aria-current="page"{{end}}>Settings</a>
    </nav>
    <div class="who">{{.Owner}}</div>
  </header>
  <main id="main">
{{end}}

{{define "page_foot"}}
  </main>
  <footer>Tailnet only · server-rendered Go templates + htmx</footer>
</body>
</html>{{end}}
