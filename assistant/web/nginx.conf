# Static-only server for the Dashboard artifact. It is never published to the
# host: the assistant is the only client and the only identity gate. The
# assistant decides SPA routing (`try_files` on the Go side), so a missing file
# is a real 404 here rather than index.html.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A local probe for Compose; it never calls the internet.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # The build writes .gz and .br siblings; the assistant asks for one of those
    # directly, so plain static file serving is all this needs. $uri/ exists so
    # a bare "/" resolves to index.html; a missing file still 404s here.
    location / {
        try_files $uri $uri/ =404;
    }
}
