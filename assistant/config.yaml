# Non-secret assistant settings. Secrets belong in .env, never here.

http:
  # Health endpoint. Docker publishes this on the host loopback only.
  addr: ":8080"

debug:
  # Localhost-only typed-transcript entry used to exercise the pipeline.
  enabled: true
  # Loopback by default. Compose overrides this to ":8081" because the
  # published port is already bound to 127.0.0.1 on the host.
  addr: "127.0.0.1:8081"

tools:
  # Applied to Tools that do not declare their own timeout.
  default_timeout: 2s

# Embed service (MiniLM). Model name is here so bge-small can be tried later.
embed:
  url: "http://embed:8085"
  model: "sentence-transformers/all-MiniLM-L6-v2"
  # Per-request budget; over it, semantic matching is skipped.
  timeout: 150ms

# Semantic Fast path placeholders until the eval set (#26) tunes them.
semantic:
  threshold: 0.70
  margin: 0.08
  # Compound requests with one of these joiners go to the Agent path.
  joiners: ["and", "then", "also"]

tts:
  # Wyoming TTS service. Compose sets this to the tts container; an empty
  # address disables spoken replies and leaves the debug entry text-only.
  addr: "tts:10200"
  # Pocket TTS voice name, a local wav, or an hf:// voice URL.
  voice: "alba"
  # Covers connect plus the gap between audio chunks.
  timeout: 30s

playback:
  # pacat from pulseaudio-utils. Only this container mounts the Pulse socket.
  binary: "pacat"
  # Named Pulse sink, e.g. the Echo Dot once Bluetooth A2DP is set up.
  # Empty uses the host's default sink.
  sink: ""

# Exact-match Control phrases, entered just after STT.
control_phrases:
  "what time is it": time.now
  "what's the time": time.now
  "what is the time": time.now
  "tell me the time": time.now
  "time": time.now
  # Playback and timer controls are single words, which embed poorly, so they
  # are matched exactly instead. "louder" calls volume_set with no arguments,
  # which means one step up.
  "stop": audio.stop
  "pause": audio.stop
  "cancel": timer.cancel
  "louder": audio.volume_set

# The Agent path: one OpenAI-compatible provider, no failover.
agent:
  provider: openrouter
  providers:
    openrouter:
      base_url: https://openrouter.ai/api/v1
      # The key lives only in the environment, never in this file.
      api_key_env: OPENROUTER_API_KEY
      model: deepseek/deepseek-v4.1-flash
      alternate_model: deepseek/deepseek-v4-pro
      routing:
        # OpenRouter prefers low-latency hosts. ZDR and data-collection denial
        # are forced in code (ADR-0002), not configurable here.
        sort: latency
  unavailable_message: "Sorry, I can't answer that right now."
  # Typed prefixes that skip the Fast path entirely.
  request_prefixes:
    - ask the agent
    - agent
    - hey agent
  history:
    turns: 10
    quiet: 5m
  first_token_timeout: 8s
  request_timeout: 60s
  max_steps: 6
